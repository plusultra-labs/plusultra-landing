<!--
  Plusultra Labs email signature.

  To use it: copy everything from <table> to </table>, then paste into
  Gmail → Settings → See all settings → Signature, or Apple Mail → Settings →
  Signatures (tick "Always match my default message font" OFF first).

  To make one for someone else, change the three lines marked EDIT. Nothing
  else should move — the widths, the divider and the spacing are what keep it
  from collapsing in Outlook.

  The logo is served from the live site, so it only renders once this repo is
  deployed. It is the dark plate on purpose: it carries its own background, so
  it holds up on a white message and in a client's dark mode alike.

  Tables, inline styles and px sizes are not old-fashioned here, they are the
  only things every mail client agrees on. Do not "modernise" this to flexbox.
-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Helvetica,Arial,sans-serif;">
  <tr>
    <td style="padding:0 20px 0 0;vertical-align:top;">
      <a href="https://plusultralabs.com" style="text-decoration:none;">
        <img src="https://plusultralabs.com/brand/plusultra-labs-email-dark.png"
             width="150" height="75" alt="Plusultra Labs"
             style="display:block;width:150px;height:75px;border:0;outline:none;text-decoration:none;">
      </a>
    </td>
    <td style="padding:0 20px 0 0;vertical-align:top;">
      <!-- The rule from the logo, standing up as the divider. -->
      <div style="width:1px;height:75px;background-color:#DFDCD6;font-size:0;line-height:0;">&nbsp;</div>
    </td>
    <td style="vertical-align:top;">
      <!-- EDIT: name -->
      <div style="font-size:15px;line-height:20px;font-weight:600;color:#22252C;letter-spacing:-0.2px;">
        Alberto Lina
      </div>
      <!-- EDIT: role -->
      <div style="font-size:13px;line-height:18px;color:#71767F;padding-top:1px;">
        Founder &middot; Product
      </div>
      <div style="font-size:13px;line-height:18px;color:#71767F;">
        Plusultra Labs &middot; AI product studio
      </div>
      <div style="font-size:13px;line-height:18px;padding-top:7px;">
        <!-- EDIT: email -->
        <a href="mailto:alberto@plusultralabs.com" style="color:#2C5484;text-decoration:none;">alberto@plusultralabs.com</a>
        <span style="color:#C9C5BD;">&nbsp;&middot;&nbsp;</span>
        <a href="https://plusultralabs.com" style="color:#2C5484;text-decoration:none;">plusultralabs.com</a>
      </div>
      <div style="font-size:12px;line-height:17px;color:#9A9EA6;padding-top:5px;">
        Singapore &middot;
        <a href="https://plusultralabs.com/contact" style="color:#9A9EA6;text-decoration:underline;">Book a 30-minute call</a>
      </div>
    </td>
  </tr>
</table>
